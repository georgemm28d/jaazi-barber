name: Publicar en Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Empaquetar el sitio
        run: |
          mkdir -p dist
          cp index.html agendar.html revisar.html panel.html robots.txt llms.txt sitemap.xml .nojekyll dist/
          cp -r assets dist/
          cd dist && zip -qr ../sitio.zip .

      - name: Subir a Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @sitio.zip \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys" \
            -o respuesta.json
          cat respuesta.json
          grep -q '"state":"ready"\|"state":"uploaded"\|"state":"enqueued"' respuesta.json
